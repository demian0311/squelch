<svg viewBox="0 0 320 110" xmlns="http://www.w3.org/2000/svg" font-size="10" fill="currentColor">
  <style>.l{stroke:currentColor;stroke-width:1;fill:none}.t{font-size:9px;opacity:.75}.b{fill:var(--c)}</style>
  <rect x="12" y="20" width="296" height="60" fill="currentColor" opacity=".08"/>
  <g class="b"><rect x="40" y="30" width="3" height="8"/><rect x="40" y="52" width="3" height="8"/><rect x="40" y="70" width="3" height="8"/>
  <rect x="130" y="30" width="3" height="8"/><rect x="130" y="52" width="3" height="8"/><rect x="130" y="70" width="3" height="8"/>
  <rect x="220" y="30" width="3" height="8"/><rect x="220" y="52" width="3" height="8"/><rect x="220" y="70" width="3" height="8"/>
