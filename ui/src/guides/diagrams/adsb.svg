<svg viewBox="0 0 320 150" xmlns="http://www.w3.org/2000/svg" font-size="10" fill="currentColor">
  <style>.l{stroke:currentColor;stroke-width:1;fill:none}.t{font-size:9px;opacity:.75}.c{fill:var(--c)}</style>
  <g class="c"><circle cx="30" cy="14" r="3"/><circle cx="60" cy="8" r="3"/><circle cx="90" cy="14" r="3"/></g>
  <text class="t" x="60" y="28" text-anchor="middle">GPS satellites</text>
