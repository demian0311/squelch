<svg viewBox="0 0 320 130" xmlns="http://www.w3.org/2000/svg" font-size="10" fill="currentColor">
  <style>.l{stroke:currentColor;stroke-width:1;fill:none}.c{fill:var(--c);opacity:.8}.v{fill:var(--c);opacity:.25}.t{font-size:9px;opacity:.75}</style>
  <rect class="c" x="12" y="20" width="296" height="16" rx="3"/>
  <text x="160" y="32" text-anchor="middle" fill="var(--bg)">control channel · always on · "fire dispatch, go to channel 4"</text>
  <g>
    <rect class="v" x="12" y="52" width="68" height="14" rx="3"/><text x="46" y="62" text-anchor="middle">channel 1</text>
    <rect class="v" x="88" y="52" width="68" height="14" rx="3"/><text x="122" y="62" text-anchor="middle">channel 2</text>
    <rect class="v" x="164" y="52" width="68" height="14" rx="3"/><text x="198" y="62" text-anchor="middle">channel 3</text>
    <rect class="c" x="240" y="52" width="68" height="14" rx="3"/><text x="274" y="62" text-anchor="middle" fill="var(--bg)">channel 4</text>
  </g>
  <path class="l" d="M274 66v22"/>
  <text x="274" y="100" text-anchor="middle">the call plays here</text>
  <text class="t" x="12" y="100">a talkgroup = who is talking (fire, police, EMS…)</text>
  <text class="t" x="12" y="118">this receiver reads the control channel and follows each call to its channel</text>
</svg>
