[package]
name = "squelch"
version = "0.1.0"
edition = "2021"
description = "Squelch: an RTL-SDR receiver"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
radio = { path = "../crates/radio" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
