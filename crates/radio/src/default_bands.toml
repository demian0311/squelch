# Bands shown in the receiver's band list.
#
# Copied to ~/.config/squelch/bands.toml on first start; edit that copy.
# Full format: docs/bands.md in https://github.com/demian0311/squelch
# Each band picks the mode used when you tune inside it. Bookmarks label
# known frequencies; a bookmark can override the band's mode.
#
# icon: radio plane cloud anchor walkie train wave tower pin msg balloon key mesh dish star therm
# mode: wfm nfm am usb lsb none

[[group]]
id = "listen"
name = "Listen"

[[group]]
id = "ham"
name = "Ham"

[[group]]
id = "data"
name = "Data and tracking"

[[group]]
id = "space"
name = "Space"

# ── Listen ─────────────────────────────────────────────

[[band]]
id = "fm"
group = "listen"
name = "FM radio"
icon = "radio"
mode = "wfm"
low_mhz = 87.8
high_mhz = 108.0
start_mhz = 101.1

