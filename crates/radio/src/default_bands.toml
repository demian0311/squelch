# Bands shown in the receiver's band list.
#
# Copied to ~/.config/squelch/bands.toml on first start; edit that copy.
# Full format: docs/bands.md in https://github.com/demian0311/squelch
# Each band picks the mode used when you tune inside it. `names` say what a
# frequency is for and can override the band's mode. `bookmarks` are the ones
# you saved; the app writes those.
#
# icon: radio plane cloud anchor walkie truck train wave tower pin msg balloon key mesh dish star therm siren
# mode: wfm nfm am usb lsb none p25

[[group]]
id = "listen"
name = "Listen"

[[group]]
id = "safety"
name = "Public safety"

[[group]]
id = "ham"
name = "Ham"

[[group]]
id = "data"
name = "Data and tracking"

[[group]]
id = "space"
name = "Space"

