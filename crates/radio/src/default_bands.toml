# ── Public safety ──────────────────────────────────────
# P25 trunked radio: tune a control channel (always on) and calls are followed from it.

[[band]]
id = "ps700"
group = "safety"
name = "EMS 700"
icon = "siren"
mode = "p25"
low_mhz = 769.0
high_mhz = 775.0
start_mhz = 773.79375
names = [
  { mhz = 773.79375, name = "Colorado statewide, site 3-55 control" },
]

[[band]]
id = "ps800"
group = "safety"
name = "EMS 800"
icon = "siren"
mode = "p25"
low_mhz = 851.0
high_mhz = 869.0
# Enters where a 2.4 MHz capture holds most of a site's channels (Miami-Dade's downtown site: 851.11-853.86).
start_mhz = 852.5
# The national interoperability channels are the same everywhere (NIFOG, read from RadioReference's copy 2026-11-05);
# these 800 MHz ones are plain FM, so they carry their own mode.
names = [
  { mhz = 851.0125, name = "Calling, any agency (8CALL90)", mode = "nfm" },
  { mhz = 851.5125, name = "Tactical (8TAC91)", mode = "nfm" },
  { mhz = 852.0125, name = "Tactical (8TAC92)", mode = "nfm" },
  { mhz = 852.5125, name = "Tactical (8TAC93)", mode = "nfm" },
  { mhz = 853.0125, name = "Tactical (8TAC94)", mode = "nfm" },
]

