[package]
name = "radio"
version = "0.1.0"
edition = "2021"
description = "Receiver engine: RTL-SDR access, spectrum, detection, demodulation, audio"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1"
cpal = "0.18"
dirs = "7"
libloading = "0.8"
num-complex = "0.4"
ogg = "0.9.2"
rustfft = "6"
serde = { version = "1", features = ["derive"] }
sgp4 = { version = "2.4", default-features = false, features = ["std"] }
toml = "1"
toml_edit = "0.25"
